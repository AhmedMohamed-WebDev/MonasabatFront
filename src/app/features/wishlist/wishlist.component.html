<div class="container py-4">
    <h3>{{ 'wishlist.title' | translate }}</h3>

    <div *ngIf="loading" class="text-center py-4">
        <div class="spinner-border text-warning" role="status">
            <span class="visually-hidden">{{ 'common.loading' | translate }}</span>
        </div>
    </div>

    <div *ngIf="!loading && services.length === 0" class="alert alert-info">
        {{ 'wishlist.empty' | translate }}
    </div>

    <div *ngIf="!loading && services.length > 0">
        <div class="row">
            <div class="col-md-6 mb-3" *ngFor="let s of services">
                <div class="card h-100" (click)="viewService(s._id)" style="cursor:pointer;">
                    <img [src]="s.images?.[0] || 'assets/placeholder.png'" class="card-img-top" alt="{{s.name}}">
                    <div class="card-body">
                        <h5 class="card-title">{{ s.name }}</h5>
                        <p class="card-text text-muted">{{ s.description | slice:0:120 }}...</p>
                        <div class="d-flex justify-content-between align-items-center">
                            <small class="text-muted">{{ s.supplier?.name }}</small>
                            <button class="btn btn-sm btn-outline-danger"
                                (click)="$event.stopPropagation(); remove(s._id)">{{ 'wishlist.remove' | translate
                                }}</button>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>
